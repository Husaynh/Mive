<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه صادرات و پخش عمده میوه</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --bg2:#f3f5f9; --sd:#c8cedb; --sl:#ffffff;
  --txt:#38435a; --muted:#7c879c; --line:#d9dee8;
  --pri:#ea580c; --pri2:#f59e0b;
  --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#0284c7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;font-size:14px}
.neu{background:var(--bg);border-radius:20px;box-shadow:9px 9px 18px var(--sd),-9px -9px 18px var(--sl)}
.neu-s{background:var(--bg);border-radius:14px;box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl)}
.neu-in{background:var(--bg);border-radius:14px;box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;padding:34px 28px;border-radius:26px;text-align:center}
.login-logo{width:78px;height:78px;display:grid;place-items:center;font-size:36px;border-radius:24px;margin:0 auto 18px}
.login-card h1{margin:0 0 4px;font-size:1.3rem}
.login-sub{color:var(--muted);font-size:.85rem;margin:0 0 22px}
.login-card form{display:flex;flex-direction:column;gap:14px;text-align:right}
.login-hint{margin-top:20px;padding:14px;background:var(--bg2);border-radius:14px;text-align:right;font-size:.75rem;color:var(--muted);line-height:1.9}
.login-hint p{margin:0 0 6px;font-weight:600;color:var(--txt)}
#loginErr{color:var(--bad);font-size:.8rem;min-height:18px;text-align:center}

/* ===== Layout ===== */
.wrap{display:grid;grid-template-columns:256px 1fr;gap:22px;padding:22px;min-height:100vh;max-width:1700px;margin:0 auto}
@media(max-width:980px){.wrap{grid-template-columns:1fr;padding:14px;gap:14px}}
.side{position:sticky;top:22px;height:calc(100vh - 44px);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
@media(max-width:980px){.side{position:static;height:auto}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand .logo{width:46px;height:46px;display:grid;place-items:center;font-size:22px;border-radius:15px;flex:none}
.brand b{display:block;font-size:.88rem;line-height:1.3}
.brand small{color:var(--muted);font-size:.7rem;display:block}
nav{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;padding-left:2px}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;color:var(--txt);padding:9px 12px;border-radius:13px;background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;text-align:right}
.nav-btn span.ic{font-size:1rem;width:20px;text-align:center;flex:none}
.nav-btn:hover{color:var(--pri)}
.nav-btn.active{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #c8cedb,-4px -4px 10px var(--sl)}
.side-foot{display:flex;flex-direction:column;gap:9px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;flex:1;min-width:180px}
.search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:.86rem;color:var(--txt);width:100%}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{padding:8px 14px;font-size:.78rem;color:var(--muted);border-radius:12px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px}
.user-chip .av{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:700;font-size:.9rem}

/* ===== Buttons / Form ===== */
.btn{border:0;cursor:pointer;border-radius:14px;padding:10px 16px;font-family:inherit;font-size:.85rem;background:var(--bg);color:var(--txt);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{color:var(--pri)}
.btn:active{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #c8cedb,-4px -4px 10px var(--sl)}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.btn.ok{color:#fff;background:linear-gradient(135deg,#34d399,#16a34a)}
.btn.ok:hover{color:#fff}
.btn.bad{color:#fff;background:linear-gradient(135deg,#fb7185,#e11d48)}
.btn.bad:hover{color:#fff}
.btn.warn{color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.btn.warn:hover{color:#fff}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:11px}
.btn.full{width:100%}
.fld{display:flex;flex-direction:column;gap:6px;font-size:.79rem;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:0;outline:none;font-family:inherit;font-size:.86rem;color:var(--txt);padding:10px 13px;border-radius:13px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl),0 0 0 2px #f8c39a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* ===== Cards ===== */
.card{padding:20px;margin-bottom:20px;border-radius:20px}
.card h3{margin:0 0 16px;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{margin:16px 0 10px;font-size:.86rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.stat{padding:16px 18px;border-radius:20px}
.stat .i{font-size:1.3rem}
.stat .t{font-size:.74rem;color:var(--muted);margin-top:8px}
.stat .v{font-size:1.35rem;font-weight:700;margin-top:4px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:.83rem}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:4px 12px;font-size:.74rem;white-space:nowrap}
.tbl td{background:var(--bg2);padding:11px 12px;vertical-align:middle}
.tbl tbody tr td:first-child{border-radius:0 14px 14px 0}
.tbl tbody tr td:last-child{border-radius:14px 0 0 14px}
.tbl tbody tr:hover td{background:#e8ecf4}
.tbl-wrap{overflow-x:auto}
.tbl tfoot td{background:#e2e7f1;font-weight:700;border-radius:0!important}
.badge{display:inline-block;padding:4px 10px;border-radius:10px;font-size:.72rem;font-weight:600}
.b-ok{background:#dcfce7;color:#15803d}
.b-bad{background:#ffe4e6;color:#be123c}
.b-warn{background:#fef3c7;color:#b45309}
.b-info{background:#e0f2fe;color:#0369a1}
.b-mut{background:#e5e9f2;color:#5b6478}
.b-pri{background:#ffedd5;color:#c2410c}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:.85rem}
.hint{font-size:.76rem;color:var(--muted);line-height:2}
.bar-track{height:10px;border-radius:10px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);overflow:hidden}
.bar-track>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pri),var(--pri2))}

/* charts */
.chart-bars{display:flex;flex-direction:column;gap:11px}
.chart-row{display:grid;grid-template-columns:110px 1fr 92px;align-items:center;gap:12px;font-size:.79rem}
.chart-row .lbl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-row .val{text-align:left;font-weight:700;font-size:.78rem;direction:ltr}
.chart-track{height:14px;border-radius:9px;background:var(--bg2);overflow:hidden;box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl)}
.chart-track>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri2),var(--pri));transition:width .5s}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.79rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;flex:none}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(56,67,90,.34);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:99}
.modal{width:100%;max-width:660px;max-height:90vh;overflow:auto;padding:22px;border-radius:22px;animation:pop .18s ease;background:var(--bg)}
.modal.wide{max-width:940px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0;font-size:1rem}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;margin-top:20px;flex-wrap:wrap}
.icon-btn{border:0;cursor:pointer;width:34px;height:34px;border-radius:11px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);font-family:inherit;font-size:.9rem}

/* toast */
#toasts{position:fixed;bottom:22px;left:22px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:340px}
.toast{padding:12px 18px;border-radius:14px;font-size:.82rem;background:var(--bg);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-right:4px solid var(--ok)}
.toast.bad{border-right:4px solid var(--bad)}
.toast.warn{border-right:4px solid var(--warn)}
.toast.info{border-right:4px solid var(--info)}

/* doc preview */
.doc-preview{background:#fff;border-radius:16px;padding:14px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line)}
.doc-preview .doc-a4{transform-origin:top right;transform:scale(.62);margin-bottom:-38%}

/* ================= PRINT ================= */
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{background:#fff!important;margin:0;padding:0}
  #app,#loginScreen,.modal-bg,#toasts{display:none!important}
  #printSheet{display:block!important}
  .doc-a4{width:194mm;min-height:281mm;direction:rtl;color:#111;font-family:Vazirmatn,Tahoma,sans-serif;
          -webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:9.5pt;position:relative;
          padding-bottom:14mm;display:flex;flex-direction:column}
}
/* doc styles shared preview+print */
.doc-a4{background:#fff;color:#111;font-size:11px;direction:rtl;font-family:Vazirmatn,Tahoma,sans-serif;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc-a4 *{box-sizing:border-box}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    border-bottom:2px solid #ea580c;padding-bottom:9px;margin-bottom:11px}
.dh .brandbox{display:flex;gap:11px;align-items:center}
.dh .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#ea580c,#f59e0b);
          color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.dh h1{margin:0;font-size:14px;font-weight:800;letter-spacing:-.2px}
.dh .sub{font-size:8.6px;color:#555;line-height:1.7;margin-top:2px}
.dh .meta{text-align:left;font-size:9px;line-height:1.9;white-space:nowrap}
.dh .meta b{color:#ea580c}
.doc-title{text-align:center;font-size:15px;font-weight:800;letter-spacing:1px;
           background:linear-gradient(90deg,#fff7ed,#ffedd5,#fff7ed);border:1px solid #fed7aa;
           border-radius:8px;padding:6px;margin-bottom:11px;color:#9a3412}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.pbox{border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:9.2px;line-height:1.9;background:#fafafa}
.pbox b{color:#ea580c;font-size:8.4px;display:block;margin-bottom:3px;letter-spacing:.3px}
table.dt{width:100%;border-collapse:collapse;font-size:9.2px;margin-bottom:10px}
table.dt th{background:#fff1e6;color:#9a3412;font-size:8.5px;padding:6px 5px;border:1px solid #fed7aa;font-weight:700}
table.dt td{padding:5px;border:1px solid #e5e7eb;text-align:center}
table.dt td.r{text-align:right}
table.dt tbody tr:nth-child(even) td{background:#fcfcfd}
table.dt tfoot td{background:#f8fafc;font-weight:800;border-top:2px solid #ea580c}
.totbox{display:flex;justify-content:flex-end;margin-bottom:10px}
.totbox table{font-size:9.6px;border-collapse:collapse;min-width:230px}
.totbox td{padding:5px 10px;border-bottom:1px solid #eee}
.totbox tr.grand td{background:#fff1e6;color:#9a3412;font-weight:800;font-size:11px;border:1px solid #fed7aa;border-radius:6px}
.inwords{border:1px dashed #cbd5e1;border-radius:8px;padding:7px 10px;font-size:9px;color:#475569;margin-bottom:11px;background:#f8fafc}
.chartbox{border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;margin-bottom:11px;background:#fff}
.chartbox .ct{font-size:8.6px;color:#64748b;margin-bottom:8px;font-weight:700}
.pchart{display:flex;flex-direction:column;gap:6px}
.pchart .prow{display:grid;grid-template-columns:86px 1fr 74px;gap:8px;align-items:center;font-size:8.6px}
.pchart .pt{height:9px;background:#f1f5f9;border-radius:5px;overflow:hidden}
.pchart .pt>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f59e0b,#ea580c)}
.pchart .pv{text-align:left;direction:ltr;font-weight:700;font-size:8.4px}
.signs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:auto;padding-top:16px;font-size:9px;text-align:center}
.signs .s{border-top:1px dotted #94a3b8;padding-top:6px;color:#475569}
.foot{position:absolute;bottom:4mm;right:0;left:0;border-top:1px solid #e2e8f0;padding-top:5px;
      font-size:7.6px;color:#94a3b8;display:flex;justify-content:space-between}
/* weigh ticket */
.ticket{border:2px dashed #ea580c;border-radius:12px;padding:14px;margin-bottom:12px}
.ticket .bigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.ticket .big{border:1px solid #fed7aa;border-radius:10px;padding:10px;text-align:center;background:#fff7ed}
.ticket .big small{display:block;font-size:8.4px;color:#9a3412;margin-bottom:4px}
.ticket .big b{font-size:19px;color:#c2410c;direction:ltr;display:block}
.ticket .big span{font-size:8px;color:#94a3b8}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:9.4px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dotted #e2e8f0;padding:3px 0}
.kv div b{color:#334155}
.stamp{position:absolute;left:12mm;bottom:40mm;border:2px solid #ea580c;color:#ea580c;
       border-radius:50%;width:26mm;height:26mm;display:grid;place-items:center;font-size:7.4px;
       text-align:center;transform:rotate(-14deg);opacity:.55;font-weight:800;line-height:1.4}

/* docs page */
.doc-item{padding:14px 16px;border-radius:14px;background:var(--bg2);margin-bottom:10px;border-right:4px solid var(--pri)}
.doc-item b{display:block;margin-bottom:6px;font-size:.88rem}
.doc-item p{margin:0;font-size:.8rem;color:var(--muted);line-height:2}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card neu">
    <div class="login-logo neu-in">🍎</div>
    <h1 id="loginTitle">صادرات و پخش عمده میوه</h1>
    <p class="login-sub" id="loginSub">ورود به حساب کاربری</p>
    <form id="loginForm" onsubmit="doLogin(event)">
      <label class="fld"><span>نام کاربری</span><input id="loginUser" autocomplete="username" required></label>
      <label class="fld"><span>رمز عبور</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
      <div id="loginErr"></div>
      <button class="btn primary full" type="submit">🔐 ورود</button>
    </form>
    <div class="login-hint">
      <p>راهنمای ورود اولیه:</p>
      <small>مدیر سیستم: <b>admin</b> / <b>admin</b></small><br>
      <small>مدیرعامل: <b>manager</b> / <b>1234</b></small><br>
      <small>سرکارگر: <b>foreman</b> / <b>1234</b></small><br>
      <small>حسابدار: <b>acc</b> / <b>1234</b></small>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="wrap" style="display:none">
  <aside class="side neu">
    <div class="brand">
      <div class="logo neu-in">🍎</div>
      <div><b id="brandName">میوه پارس</b><small id="brandYear">1404</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn full" onclick="go('docs')">📖 راهنمای کاربری</button>
      <button class="btn full bad" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <main>
    <header class="topbar neu">
      <div class="search neu-in"><span>🔎</span><input id="q" placeholder="جستجو در این بخش..."></div>
      <div class="top-actions">
        <span class="pill neu-s" id="datePill"></span>
        <div class="user-chip neu-s">
          <div class="av" id="avatar">؟</div>
          <div><b id="userName" style="font-size:.83rem">—</b><small style="display:block;color:var(--muted);font-size:.7rem" id="userRole">—</small></div>
        </div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="printSheet"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============================================================
   1) ابزارها
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoToday = () => new Date().toISOString().slice(0,10);
const faDate = d => { if(!d) return '—'; try{ return new Date(d).toLocaleDateString('fa-IR'); }catch(e){ return d; } };
const num = n => (Number(n)||0).toLocaleString('fa-IR',{maximumFractionDigits:2});
const money = n => Math.round(Number(n)||0).toLocaleString('fa-IR');
const toFa = n => String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sum = (arr,f)=> arr.reduce((a,x)=>a+(Number(f(x))||0),0);
const codeNum = ()=> String(Math.floor(Math.random()*9000)+1000);

/* اعداد به حروف (تومان) */
function toWords(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'صفر';
  const yek=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const dah=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const dah2=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const sad=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scale=['','هزار','میلیون','میلیارد','بیلیون'];
  function three(n){
    let out=[];
    const s=Math.floor(n/100), d=Math.floor((n%100)/10), y=n%10;
    if(s) out.push(sad[s]);
    if(d===1) out.push(dah2[y]);
    else{ if(d) out.push(dah[d]); if(y) out.push(yek[y]); }
    return out.join(' و ');
  }
  const parts=[]; let i=0;
  while(num>0){
    const g = num%1000;
    if(g) parts.unshift(three(g)+ (scale[i]?(' '+scale[i]):''));
    num = Math.floor(num/1000); i++;
  }
  return parts.join(' و ');
}

function modal(title, html, onOk, okText='ذخیره', wide){
  const m=document.createElement('div');
  m.className='modal-bg';
  m.innerHTML=`<div class="modal ${wide?'wide':''} neu">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="modal-body">${html}</div>
      <div class="modal-foot">
        ${onOk?`<button class="btn primary" data-ok>${okText}</button>`:''}
        <button class="btn" data-close>انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{
    if(e.target===m || e.target.closest('[data-close]')) m.remove();
    if(e.target.closest('[data-ok]')){
      if(onOk && onOk(m)===false) return;
      m.remove();
    }
  });
  const f=m.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),60);
  return m;
}

/* نمودار میله‌ای */
function barChart(data, unit=''){
  if(!data.length) return '<div class="empty">داده‌ای موجود نیست</div>';
  const max = Math.max(...data.map(d=>d.value),1);
  return `<div class="chart-bars">`+data.map(d=>`
    <div class="chart-row">
      <span class="lbl" title="${esc(d.label)}">${esc(d.label)}</span>
      <div class="chart-track"><i style="width:${Math.max(2,(d.value/max)*100)}%"></i></div>
      <span class="val">${num(d.value)} ${unit}</span>
    </div>`).join('')+`</div>`;
}
/* نمودار دونات */
function donutChart(data){
  const total = sum(data, d=>d.value);
  if(!total) return '<div class="empty">داده‌ای موجود نیست</div>';
  const colors=['#ea580c','#f59e0b','#16a34a','#0284c7','#7c3aed','#e11d48','#0891b2','#65a30d'];
  const r=40, cx=50, cy=50, C=2*Math.PI*r;
  let off=0;
  const segs = data.map((d,i)=>{
    const len = (d.value/total)*C;
    const col = d.color||colors[i%colors.length];
    const s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="17"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return s;
  }).join('');
  const legend = data.map((d,i)=>
    `<div><i style="background:${d.color||colors[i%colors.length]}"></i>${esc(d.label)}
     <b style="margin-right:auto;padding-right:8px">${num(Math.round(d.value/total*100))}٪</b></div>`).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 100 100">${segs}
      <text x="50" y="48" text-anchor="middle" font-size="8" fill="#7c879c">مجموع</text>
      <text x="50" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#38435a">${num(total)}</text>
    </svg>
    <div class="legend" style="flex:1">${legend}</div>
  </div>`;
}

function vPacking(){
  if(!pState.cid && DB.consignments.length){
    pState.cid = DB.consignments.slice().reverse().find(c=>c.status!=='ارسال شده')?.id || DB.consignments.slice(-1)[0].id;

function quickFill(){
  const c = getCons(pState.cid); if(!c) return;
  const f = getFruit(c.fruitId);
  if(f && f.basketWeight) $('#pkWpb').value = f.basketWeight;
  toast('وزن پیش‌فرض میوه اعمال شد','info');
}

function addPacking(){
  const cid = pState.cid;
  if(!cid){ toast('ابتدا محموله را انتخاب کنید','bad'); return; }
  const workerId = $('#pkWorker').value;
  const baskets = parseFloat($('#pkBaskets').value);
  const fpb = parseFloat($('#pkFpb').value);
  const wpb = parseFloat($('#pkWpb').value);
  if(!workerId){ toast('کارگر را انتخاب کنید','bad'); return; }
  if(!(baskets>0)){ toast('تعداد سبد معتبر نیست','bad'); return; }
  if(!(fpb>0)){ toast('تعداد میوه در سبد معتبر نیست','bad'); return; }
  if(!(wpb>0)){ toast('وزن هر سبد معتبر نیست','bad'); return; }

  DB.packing.push({
    id:uid(), consignmentId:cid, workerId, baskets, fruitsPerBasket:fpb, weightPerBasket:wpb,
    date: isoToday(), note: $('#pkNote').value.trim(), by: CU.name, at:new Date().toISOString()
  });
  save(); render();
  toast('رکورد ثبت شد ✓');
}

function editPacking(id){
  const p = DB.packing.find(x=>x.id===id); if(!p) return;
  const workerOpts = DB.workers.map(w=>`<option value="${w.id}" ${w.id===p.workerId?'selected':''}>${esc(w.name)}</option>`).join('');
  const html = `<div class="grid2">
    <label class="fld"><span>کارگر</span><select name="workerId">${workerOpts}</select></label>
    <label class="fld"><span>تعداد سبد</span><input name="baskets" type="number" min="1" value="${p.baskets}"></label>
    <label class="fld"><span>تعداد میوه در سبد</span><input name="fpb" type="number" min="1" value="${p.fruitsPerBasket}"></label>
    <label class="fld"><span>وزن هر سبد (kg)</span><input name="wpb" type="number" min="0" step="0.01" value="${p.weightPerBasket}"></label>
    <label class="fld full"><span>یادداشت</span><input name="note" value="${esc(p.note||'')}"></label>
  </div>`;
  modal('✏️ ویرایش رکورد بسته‌بندی', html, m=>{
    p.workerId = $('[name=workerId]',m).value;
    p.baskets = parseFloat($('[name=baskets]',m).value)||0;
    p.fruitsPerBasket = parseFloat($('[name=fpb]',m).value)||0;
    p.weightPerBasket = parseFloat($('[name=wpb]',m).value)||0;
    p.note = $('[name=note]',m).value.trim();
    save(); render(); toast('ویرایش شد');
  });
}
function delPacking(id){
  if(!confirm('این رکورد حذف شود؟')) return;
  DB.packing = DB.packing.filter(x=>x.id!==id);

}

function vAgg(){
  const from = pState.dateFrom || '';
  const to = pState.dateTo || '';
  const inRange = d => (!from || d>=from) && (!to || d<=to);

  const cons = DB.consignments.filter(c=>inRange(c.date));
  const consIds = new Set(cons.map(c=>c.id));
  const rows = DB.packing.filter(p=>consIds.has(p.consignmentId) && inRange(p.date));

  // به تفکیک میوه
  const byFruit = {};
  rows.forEach(p=>{
    const c = getCons(p.consignmentId); if(!c) return;
    const f = getFruit(c.fruitId);
    const k = f ? fruitLabel(f) : 'نامشخص';
    if(!byFruit[k]) byFruit[k] = {baskets:0, fruits:0, weight:0};
    byFruit[k].baskets += p.baskets;
    byFruit[k].fruits  += p.baskets*p.fruitsPerBasket;
    byFruit[k].weight  += p.baskets*p.weightPerBasket;
  });
  // به تفکیک کارگر
  const byWorker = {};
  rows.forEach(p=>{
    const w = getWork(p.workerId);
    const k = w?w.name:'نامشخص';
    if(!byWorker[k]) byWorker[k] = {baskets:0, fruits:0, weight:0};
    byWorker[k].baskets += p.baskets;
    byWorker[k].fruits  += p.baskets*p.fruitsPerBasket;
    byWorker[k].weight  += p.baskets*p.weightPerBasket;
  });

  const totB = sum(Object.values(byFruit), x=>x.baskets);
  const totF = sum(Object.values(byFruit), x=>x.fruits);
  const totW = sum(Object.values(byFruit), x=>x.weight);

  const fruitRows = Object.entries(byFruit).sort((a,b)=>b[1].weight-a[1].weight).map(([k,v])=>{
    const avg = v.baskets ? v.weight/v.baskets : 0;
    return `<tr>
      <td><b>${esc(k)}</b></td>
      <td>${num(v.baskets)}</td>
      <td>${num(v.fruits)}</td>
      <td><b>${num(v.weight)}</b></td>
      <td>${num(avg)}</td>
    </tr>`;
  }).join('');

  const workerRows = Object.entries(byWorker).sort((a,b)=>b[1].weight-a[1].weight).map(([k,v])=>{
    return `<tr>
      <td><b>${esc(k)}</b></td>
      <td>${num(v.baskets)}</td>
      <td>${num(v.fruits)}</td>
      <td><b>${num(v.weight)}</b></td>
      <td>${totW?num(v.weight/totW*100):0}٪</td>
    </tr>`;
  }).join('');

  const chartData = Object.entries(byFruit).map(([label,v])=>({label, value:v.weight})).sort((a,b)=>b.value-a.value);

  return `
  <div class="card neu">
    <h3>Σ جمع‌بندی خودکار محصولات</h3>
    <div class="toolbar">
      <label class="fld" style="min-width:160px"><span>از تاریخ</span><input type="date" value="${from}" onchange="pState.dateFrom=this.value;render()"></label>
      <label class="fld" style="min-width:160px"><span>تا تاریخ</span><input type="date" value="${to}" onchange="pState.dateTo=this.value;render()"></label>
      <button class="btn" onclick="pState.dateFrom='';pState.dateTo='';render()">♻️ حذف فیلتر</button>
      <button class="btn" onclick="printAgg()">🖨️ پرینت گزارش</button>
      <button class="btn" onclick="exportExcel()">⬇️ اکسل</button>
    </div>

    <div class="stats">
      <div class="stat neu-s"><div class="i">🧺</div><div class="t">مجموع سبدها</div><div class="v">${num(totB)}</div></div>
      <div class="stat neu-s"><div class="i">🍎</div><div class="t">مجموع میوه‌ها</div><div class="v">${num(totF)}</div></div>
      <div class="stat neu-s"><div class="i">⚖️</div><div class="t">مجموع وزن (kg)</div><div class="v" style="color:var(--pri)">${num(totW)}</div></div>
      <div class="stat neu-s"><div class="i">📋</div><div class="t">تعداد محموله</div><div class="v">${num(cons.length)}</div></div>
    </div>
  </div>

  <div class="card neu">
    <h3>🍎 جمع‌بندی به تفکیک میوه</h3>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>میوه</th><th>تعداد سبد</th><th>تعداد میوه</th><th>وزن کل (kg)</th><th>میانگین وزن سبد</th></tr></thead>
        <tbody>${fruitRows || '<tr><td colspan="5" class="empty">داده‌ای موجود نیست</td></tr>'}</tbody>
        ${fruitRows?`<tfoot><tr>
          <td>جمع کل</td><td>${num(totB)}</td><td>${num(totF)}</td><td>${num(totW)}</td><td>${num(totB?totW/totB:0)}</td>
        </tr></tfoot>`:''}
      </table>
    </div>
  </div>

  <div class="card neu">
    <h3>👷 عملکرد کارگران</h3>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>کارگر</th><th>سبد</th><th>میوه</th><th>وزن (kg)</th><th>سهم از وزن</th></tr></thead>
        <tbody>${workerRows || '<tr><td colspan="5" class="empty">داده‌ای موجود نیست</td></tr>'}</tbody>
      </table>
    </div>
  </div>

  <div class="card neu">
    <h3>📊 نمودار وزن به تفکیک میوه</h3>
    ${barChart(chartData,'kg')}
  </div>`;
}

function invAddItem(){
  const fid = $('#ivFruit').value;
  const w = parseFloat($('#ivWeight').value)||0;
  let price = parseFloat($('#ivPrice').value)||0;
  if(!fid){ toast('میوه را انتخاب کنید','bad'); return; }
  if(w<=0){ toast('وزن معتبر نیست','bad'); return; }
  const f = getFruit(fid);
  if(!price && f) price = f.pricePerKg||0;
  invDraft.items.push({ fruitId:fid, fruitName: fruitLabel(f), weight:w, pricePerKg:price });
  render();
}
function invDelItem(i){ invDraft.items.splice(i,1); render(); }

function saveInvoice(andPrint){
  const d = invDraft;
  if(!d.items.length){ toast('حداقل یک قلم اضافه کنید','bad'); return; }
  if(!d.customerName.trim()){ toast('نام خریدار الزامی است','bad'); return; }
  const subTotal = sum(d.items, x=>x.weight*x.pricePerKg);
  const afterDisc = Math.max(0, subTotal - (+d.discount||0));
  const taxAmt = Math.round(afterDisc * ((+d.tax||0)/100));
  const total = afterDisc + taxAmt;
  const code = 'INV-' + d.date.replace(/-/g,'') + '-' + codeNum();

  const inv = {
    id: uid(), code, date: d.date,
    customerId: d.customerId, customerName: d.customerName,
    items: JSON.parse(JSON.stringify(d.items)),
    subTotal, discount:+d.discount||0, taxPercent:+d.tax||0, taxAmount: taxAmt, total,
    notes: d.notes, consignmentId: d.consignmentId||'',
    by: CU.name, at: new Date().toISOString()
  };
  DB.invoices.push(inv);
  save();
  invDraft = null;
  toast('فاکتور ذخیره شد ✓');
  if(andPrint){ printInvoice(inv.id); go('invoice'); }
  else go('invoice');
}

function delInvoice(id){
  if(!confirm('فاکتور حذف شود؟')) return;
  DB.invoices = DB.invoices.filter(x=>x.id!==id);
  save(); render(); toast('حذف شد','warn');
}

function printAgg(){

      </div>
    </div>

    <table class="dt">
      <thead><tr><th>میوه</th><th>تعداد سبد</th><th>تعداد میوه</th><th>وزن کل (kg)</th><th>میانگین وزن سبد</th></tr></thead>
      <tbody>${Object.entries(byFruit).sort((a,b)=>b[1].weight-a[1].weight).map(([k,v])=>`
        <tr>
          <td class="r">${esc(k)}</td>
          <td>${num(v.baskets)}</td>
          <td>${num(v.fruits)}</td>
          <td>${num(v.weight)}</td>
          <td>${num(v.baskets?v.weight/v.baskets:0)}</td>
        </tr>`).join('')}</tbody>
      <tfoot><tr>
        <td>جمع کل</td><td>${num(totB)}</td><td>${num(totF)}</td><td>${num(totW)}</td><td>${num(totB?totW/totB:0)}</td>

          <div class="prow"><span>${esc(k)}</span>

function addUser(){
  modal('＋ کاربر جدید', userForm(), m=>{
    const name = $('[name=name]',m).value.trim();
    const un = $('[name=username]',m).value.trim();
    const pw = $('[name=password]',m).value;
    if(!name||!un||!pw){ toast('همه فیلدها الزامی','bad'); return false; }
    if(DB.users.some(x=>x.username===un)){ toast('نام کاربری تکراری','bad'); return false; }
    DB.users.push({id:uid(), name, username:un, password:pw, role:$('[name=role]',m).value, active:true});
    save(); render(); toast('کاربر اضافه شد');
  });
}
function editUser(id){
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  modal('✏️ ویرایش کاربر', userForm(u), m=>{
    const un = $('[name=username]',m).value.trim();
    if(DB.users.some(x=>x.id!==id && x.username===un)){ toast('نام کاربری تکراری','bad'); return false; }
    u.name = $('[name=name]',m).value.trim();
    u.username = un;
    u.password = $('[name=password]',m).value;
    if(u.role!=='admin') u.role = $('[name=role]',m).value;
    save(); render(); toast('ویرایش شد');
  });
}
function toggleUser(id){
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید غیرفعال کنید','bad'); return; }
  u.active = !u.active; save(); render();
}
function delUser(id){
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید حذف کنید','bad'); return; }
  if(!confirm('کاربر حذف شود؟')) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  save(); render(); toast('حذف شد','warn');
}

  const wb = XLSX.utils.book_new();

  const s1 = [['کد','تاریخ','مجموعه','میوه','کامیون','راننده','سبد','وزن (kg)','وضعیت']];
  DB.consignments.forEach(c=>{
    const t = consTotals(c.id);
    s1.push([c.code, c.date, (getComp(c.companyId)||{}).name||'', fruitLabel(getFruit(c.fruitId)),
      (getTrk(c.truckId)||{}).plate||'', (getDrv(c.driverId)||{}).name||'', t.baskets, t.weight, c.status||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'محموله‌ها');

  const s2 = [['کد محموله','تاریخ','کارگر','تعداد سبد','میوه در سبد','وزن هر سبد','کل میوه','کل وزن','یادداشت']];
  DB.packing.forEach(p=>{
    const c = getCons(p.consignmentId);
    s2.push([c?c.code:'', p.date, (getWork(p.workerId)||{}).name||'', p.baskets, p.fruitsPerBasket,
      p.weightPerBasket, p.baskets*p.fruitsPerBasket, p.baskets*p.weightPerBasket, p.note||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'بسته‌بندی');

  const s3 = [['کد قبض','تاریخ','ساعت','پلاک','راننده','محصول','وزن فارغ','وزن با بار','وزن خالص']];
  DB.weighbridges.forEach(w=>{
    s3.push([w.code, w.date, w.time||'', w.plate||'', (getDrv(w.driverId)||{}).name||'', w.product||'', w.tare, w.gross, w.net]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s3), 'باسکول');

  const s4 = [['شماره فاکتور','تاریخ','خریدار','اقلام','وزن کل','جمع','تخفیف','مالیات','نهایی']];
  DB.invoices.forEach(i=>{
    s4.push([i.code, i.date, i.customerName, i.items.length,
      sum(i.items,x=>x.weight), i.subTotal, i.discount, i.taxAmount, i.total]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s4), 'فاکتورها');

  const s5 = [['نام','کد','تلفن','دستمزد روزانه','وضعیت']];
  DB.workers.forEach(w=> s5.push([w.name, w.code||'', w.phone||'', w.dailyWage||0, w.active?'فعال':'غیرفعال']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s5), 'کارگران');

  XLSX.writeFile(wb, `fruit-export-${isoToday()}.xlsx`);
  toast('فایل اکسل دانلود شد');
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup-fruit-${isoToday()}.json`;
  a.click();
  toast('پشتیبان دانلود شد');
}

document.addEventListener('change', e=>{
  if(e.target && e.target.id==='jsonIn'){
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ev=>{
      try{
        const obj = JSON.parse(ev.target.result);
        if(!obj.settings || !obj.users) throw 0;
        DB = obj; migrate(); save(); render(); toast('بازیابی انجام شد');
      }catch(err){ toast('فایل معتبر نیست','bad'); }
    };
    rd.readAsText(f);
    e.target.value='';
  }
});
